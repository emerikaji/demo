name: Build and Deploy

on:
  workflow_run:
    workflows: ["Test"]
    branches:
      - main
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.docker-build.outputs.digest }}

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Kubectl Engine
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Inject Cluster Credentials
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBERNETES_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Process Runtime Environment Secrets
        run: |
          sed -i "s/PLACEHOLDER_JWT_SECRET/${{ secrets.JWT_SECRET }}/g" k8s/secret.yaml
          sed -i "s/PLACEHOLDER_DIGEST/${{ needs.build.outputs.digest }}/g" k8s/deployment.yaml

      - name: Apply Manifest Structural Graph
        run: |
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Execute Zero-Downtime Rollout Restart
        run: |
          kubectl rollout restart deployment/demo-app