name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    branches:
      - main
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Kubectl Engine
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Inject Cluster Credentials
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBERNETES_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Process Runtime Environment Secrets
        run: |
          sed -i "s/PLACEHOLDER_JWT_SECRET/${{ secrets.JWT_SECRET }}/g" k8s/secret.yaml

      - name: Apply Manifest Structural Graph
        run: |
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Execute Zero-Downtime Rollout Restart
        run: |
          kubectl rollout restart deployment/demo-app