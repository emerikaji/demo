services:
  app:
    image: ghcr.io/emerikaji/demo:latest
    networks:
      - traefik_public
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.demo.rule=Host(`eaji.cc`)'
      - 'traefik.http.routers.demo.entrypoints=websecure'
      - 'traefik.http.services.demo.loadbalancer.server.port=8080'
    restart: unless-stopped

  swagger:
    image: docker.swagger.io/swaggerapi/swagger-ui:latest
    networks:
      - traefik_public
    environment:
      - URL=https://eaji.cc/v1/swagger.yaml
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.swagger.rule=Host(`eaji.cc`) && Path(`/swagger`)'
      - 'traefik.http.routers.swagger.entrypoints=websecure'
      - 'traefik.http.services.swagger.loadbalancer.server.port=8080'

networks:
  traefik_public:
    external: true